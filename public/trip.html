<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My One-Day Trip — Journey Mapper</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-success">
  <div class="container">
    <a class="navbar-brand fw-bold" href="index.html">Journey Mapper</a>
    <div class="navbar-nav ms-auto flex-row gap-3 align-items-center">
      <a class="nav-link" href="places.html">Places</a>
      <a class="nav-link" href="map.html">Map</a>
      <a class="nav-link active" href="trip.html">My Trip <span id="tripBadge" class="badge bg-danger rounded-pill" style="display:none">0</span></a>
    </div>
  </div>
</nav>

<div class="container my-4">
  <h2 class="mb-4">🗺️ My One-Day Trip Plan</h2>
  <div id="tripList" class="row g-3"></div>
  <div id="emptyMsg" class="alert alert-info d-none">You haven't added any places to your trip yet. <a href="places.html">Browse places here</a>.</div>
  
  <div class="card mt-4 d-none" id="summaryCard">
    <div class="card-body">
      <h5 class="card-title">Trip Summary</h5>
      <p class="mb-1">Total Places: <strong id="totalPlaces">0</strong></p>
      <p class="mb-0">Estimated Total Distance: <strong id="totalDistance">0</strong> km</p>
    </div>
  </div>
</div>

<script src="js/api.js"></script>
<script>
function renderTrip() {
  const trip = JSON.parse(localStorage.getItem('myTrip') || '[]');
  const list = document.getElementById('tripList');
  const empty = document.getElementById('emptyMsg');
  const summary = document.getElementById('summaryCard');

  if (trip.length === 0) {
    list.innerHTML = '';
    empty.classList.remove('d-none');
    summary.classList.add('d-none');
    return;
  }

  empty.classList.add('d-none');
  summary.classList.remove('d-none');

  let totalDist = 0;
  list.innerHTML = trip.map((p, index) => {
    totalDist += parseFloat(p.distance) || 0;
    return `
      <div class="col-md-6">
        <div class="card shadow-sm border-0">
          <div class="card-body d-flex justify-content-between align-items-center">
            <div>
              <h5 class="card-title mb-1">${index + 1}. ${p.name}</h5>
              <small class="text-muted">${p.distance} km from Bibile</small>
            </div>
            <button class="btn btn-sm btn-outline-danger" onclick="removeFromTrip(${p.id})">Remove</button>
          </div>
        </div>
      </div>`;
  }).join('');

  document.getElementById('totalPlaces').textContent = trip.length;
  document.getElementById('totalDistance').textContent = totalDist.toFixed(1);
}

function removeFromTrip(id) {
  let trip = JSON.parse(localStorage.getItem('myTrip') || '[]');
  trip = trip.filter(p => p.id !== id);
  localStorage.setItem('myTrip', JSON.stringify(trip));
  renderTrip();
  updateTripBadge();
}

renderTrip();
</script>
</body>
</html>
