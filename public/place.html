<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Place — Journey Mapper</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-success">
  <div class="container"><a class="navbar-brand" href="index.html">Journey Mapper</a></div>
</nav>

<div class="container my-4" id="content">Loading…</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="js/api.js"></script>
<script>
(async () => {
  const id = new URLSearchParams(location.search).get('id');
  const p = await apiGet('/places/' + id);
  document.getElementById('content').innerHTML = `
    <a href="places.html" class="btn btn-sm btn-outline-secondary mb-3">← Back</a>
    <h1>${p.name}</h1>
    <div class="mb-2">${p.categories.map(c=>`<span class="badge bg-secondary me-1">${c}</span>`).join('')}</div>
    ${p.image_url ? `<img src="${p.image_url}" class="img-fluid rounded mb-3" style="max-height:400px">` : ''}
    <p>${p.description}</p>
    <ul class="list-group mb-3">
      <li class="list-group-item"><strong>Distance from Bibile:</strong> ${p.distance_km} km</li>
      <li class="list-group-item"><strong>Opening hours:</strong> ${p.opening_hours || 'Not available'}</li>
      <li class="list-group-item"><strong>Entry fee:</strong> ${p.entry_fee || 'Not available'}</li>
      <li class="list-group-item"><strong>Travel tips:</strong> ${p.travel_tips || 'Not available'}</li>
    </ul>
    <div class="alert alert-warning small">⚠ Road and weather conditions can change. Please verify locally before travelling.</div>
    <div id="map" style="height:350px;border-radius:8px"></div>
  `;
  if (p.latitude && p.longitude) {
    const m = L.map('map').setView([p.latitude, p.longitude], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap' }).addTo(m);
    L.marker([p.latitude, p.longitude]).addTo(m).bindPopup(p.name).openPopup();
  }
})();
</script>
</body>
</html>
