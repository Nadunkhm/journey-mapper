<!doctype html>
<html><head>
<meta charset="utf-8"><title>Admin Login</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head><body class="bg-light">
<div class="container" style="max-width:420px;margin-top:80px">
  <div class="card shadow"><div class="card-body">
    <h4 class="mb-3">Admin Login</h4>
    <div id="err" class="alert alert-danger d-none"></div>
    <input id="u" class="form-control mb-2" placeholder="Username">
    <input id="p" type="password" class="form-control mb-3" placeholder="Password">
    <button id="go" class="btn btn-success w-100">Login</button>
  </div></div>
</div>
<script src="js/api.js"></script>
<script>
document.getElementById('go').onclick = async () => {
  try {
    const r = await apiSend('/auth/login', 'POST', {
      username: document.getElementById('u').value,
      password: document.getElementById('p').value
    });
    localStorage.setItem('jm_token', r.token);
    location.href = 'admin-dashboard.html';
  } catch (e) {
    const err = document.getElementById('err');
    err.textContent = e.message; err.classList.remove('d-none');
  }
};
</script>
</body></html>
